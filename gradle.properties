org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
android.enableDexingArtifactTransform.parallel=true
# InnerTubeX's AAR declares compileSdk 37; targetSdk stays 34.
android.suppressUnsupportedCompileSdk=35,36,37,37.0
# AGP's androidJdkImage transform runs jlink from the JDK launching the daemon.
# The full Android Studio JBR is used because it ships jlink.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr
